services:
  chatbot:
    # Published by CI to GHCR; `docker compose pull` resolves this on the host.
    # `build` is kept so `docker compose up --build` still works locally.
    image: ghcr.io/ozdurand/oz-portfolio-chatbot:latest
    build:
      context: ../chatbot
      dockerfile: Dockerfile
    env_file: ../chatbot/.env
    volumes:
      # Persist the Chroma index across container rebuilds
      - ../chatbot/data/chroma:/app/data/chroma
      # Edit project markdown without rebuilding
      - ../chatbot/data/projects:/app/data/projects:ro
    restart: unless-stopped
    expose:
      - "8000"

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../website:/usr/share/nginx/html:ro
    depends_on:
      - chatbot
    restart: unless-stopped
