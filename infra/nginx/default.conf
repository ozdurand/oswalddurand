# Reverse proxy: serve the static site, route /api/* to the FastAPI chatbot.
# This keeps everything same-origin in production — no CORS needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.php;

    # ---- Static portfolio site -------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- FastAPI chatbot --------------------------------------------------
    location /api/ {
        proxy_pass http://chatbot:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- (Optional) PHP --------------------------------------------------
    # If you keep process_form.php, add a php-fpm service in compose and
    # uncomment this block:
    #
    # location ~ \.php$ {
    #     fastcgi_pass php-fpm:9000;
    #     fastcgi_index index.php;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #     include fastcgi_params;
    # }

    # ---- Small hardening --------------------------------------------------
    location ~ /\. { deny all; }
    client_max_body_size 1m;
}
