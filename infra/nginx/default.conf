# Reverse proxy: serve the static site, route /api/* to the FastAPI chatbot.
# This keeps everything same-origin in production — no CORS needed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Static portfolio site -------------------------------------------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- FastAPI chatbot --------------------------------------------------
    location /api/ {
        proxy_pass http://chatbot:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # PHP support removed — site is static. To re-enable PHP, add a php-fpm
    # service in docker-compose and a matching fastcgi block here.

    # ---- Small hardening --------------------------------------------------
    location ~ /\. { deny all; }
    client_max_body_size 1m;
}
