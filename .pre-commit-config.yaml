# Mirrors the CI lint job: ruff (lint + import sort) then black (formatting).
# Config lives in chatbot/pyproject.toml (line length 88, py312).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length=88"]
