  In plain HTML:   paste directly or use a build step / SSI to inline it.

<div id="chatbot-root">
  <button id="chatbot-launcher" type="button" aria-label="Open chat">
    <span aria-hidden="true">💬</span>
  </button>

  <div id="chatbot-panel" role="dialog" aria-label="Chat with Oswald's assistant">
    <header>
      <strong>Ask about Oswald</strong>
      <button id="chatbot-close" type="button" aria-label="Close">×</button>
    </header>
    <div id="chatbot-messages" aria-live="polite"></div>
    <form id="chatbot-form" autocomplete="off">
      <input id="chatbot-input" type="text" placeholder="Ask me anything…" required />
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<style>
  #chatbot-root {
    position: fixed;
    right: 24px;
    bottom: 24px;

    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #chatbot-launcher {
    width: 56px; height: 56px;
    border-radius: 50%;

    background: #111;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease;
  }
  #chatbot-launcher:hover { transform: scale(1.05); }

    display: none;
    position: absolute;

    bottom: 72px;
    width: 360px;
    max-width: calc(100vw - 32px);

    max-height: 70vh;
    background: #fff;
    color: #111;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    flex-direction: column;
  }
  #chatbot-panel.cb-open { display: flex; }
  #chatbot-panel header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
  }
  #chatbot-close {
    background: none; border: none;
    font-size: 24px; line-height: 1;
