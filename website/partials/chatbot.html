<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0e0e17;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 95%;
      max-width: 1500px;
      height: 90vh;
      background: #0c0c14;
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    /* ---------- PICTURE AREA (left) ---------- */
    .left-panel {
      width: 32%;
      background: linear-gradient(180deg, #ff9301, #e07800);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }

    .avatar-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring1,
    .ring2,
    .ring3 {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }

    .ring1 { width: 320px; height: 320px; }
    .ring2 { width: 260px; height: 260px; }
    .ring3 { width: 210px; height: 210px; }

    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      z-index: 2;
      border: 6px solid rgba(255, 255, 255, 0.6);
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* shown if the image fails to load */
    .avatar .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff9301, #ffb347);
    }

    .left-text {
      text-align: center;
      color: #fff;
    }
    .left-text strong {
      display: block;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .left-text span {
      font-size: 15px;
      opacity: 0.85;
    }

    /* ---------- RESPONSES + QUERY AREA (right) ---------- */
    .chat-panel {
      flex: 1;
      background: #0e0e17;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    /* responses fill the top, query sits at the bottom */
    .responses {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-right: 10px;
    }
    .responses::-webkit-scrollbar { width: 6px; }
    .responses::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* message bubbles (classes produced by chatbot-widget.js) */
    .cb-msg {
      max-width: 70%;
      padding: 16px 20px;
      border-radius: 20px;
      line-height: 1.5;
      font-size: 17px;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: cb-in 0.2s ease-out;
    }
    @keyframes cb-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cb-user {
      align-self: flex-end;
      background: #ff9301;
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .cb-assistant {
      align-self: flex-start;
      background: #1c1c28;
      color: rgba(255, 255, 255, 0.85);
      border-bottom-left-radius: 5px;
    }
    .cb-sources {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      line-height: 1.5;
    }
    .cb-sources strong {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #fff;
    }
    .cb-sources ul {
      margin: 0;
      padding-left: 18px;
      list-style: disc;
    }
    .cb-sources li {
      margin-bottom: 6px;
    }

    /* typing indicator */
    .cb-typing { display: inline-flex; gap: 5px; padding: 2px; }
    .cb-typing span {
      width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: cb-bounce 1.2s ease-in-out infinite;
    }
    .cb-typing span:nth-child(2) { animation-delay: 0.15s; }
    .cb-typing span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes cb-bounce {
      0%, 60%, 100% { transform: translateY(0);    opacity: 0.5; }
      30%           { transform: translateY(-5px); opacity: 1; }
    }

    .input-area {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    .input-area input {
      flex: 1;
      padding: 18px 20px;
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      outline: none;
      font-size: 16px;
      background: #1a1a2e;
      color: #fff;
    }
    .input-area input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    .input-area input:focus {
      border-color: #ff9301;
    }

    .send-btn {
      width: 70px;
      border: none;
      border-radius: 18px;
      background: #ff9301;
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .send-btn:hover {
      background: #e07800;
    }
    .send-btn svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .cb-msg pre {
      margin: 14px 0;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
    }
    .cb-msg code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
    }
    .cb-msg blockquote {
      margin: 14px 0;
      padding-left: 16px;
      border-left: 3px solid #ff9301;
      color: rgba(255, 255, 255, 0.85);
    }
    .cb-msg .mermaid {
      margin: 14px 0;
      width: 100%;
      overflow-x: auto;
    }

    @media (max-width: 560px) {
      .container {
        flex-direction: column;
        height: auto;
      }
      .left-panel {
        width: 100%;
        padding: 30px 0;
      }
      .avatar-wrapper { width: 220px; height: 220px; }
      .ring1 { width: 220px; height: 220px; }
      .ring2 { width: 180px; height: 180px; }
      .ring3 { width: 145px; height: 145px; }
      .avatar { width: 120px; height: 120px; }
      .chat-panel { padding: 20px; }
    }

    </style>

</head>
<body>

  <div class="container">

    <!-- PICTURE AREA -->
    <div class="left-panel">
      <div class="avatar-wrapper">
        <div class="ring1"></div>
        <div class="ring2"></div>
        <div class="ring3"></div>

        <div class="avatar">
          <!-- Swap src with your photo, e.g. /static/img/oswald.jpg.
               If it fails to load, a gradient "O" is shown automatically. -->
          <img class="avatar-img" src="/static/img/OzChatGPTLogo.png" alt="Oswald"
               onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder',textContent:'O'}))" />
        </div>
      </div>

      <div class="left-text">
        <strong>Oswald's Assistant</strong>
        <span>Ask me anything about his work</span>
      </div>
    </div>

    <!-- RESPONSES + QUERY AREA -->
    <div class="chat-panel">

      <!-- RESPONSES AREA (top) — messages are injected here by the script -->
      <div id="chatbot-messages" class="responses" aria-live="polite"></div>

      <!-- QUERY AREA (bottom) -->
      <form id="chatbot-form" class="input-area" autocomplete="off">
        <input id="chatbot-input" type="text" placeholder="Type your message..." required />
        <button type="submit" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </form>

    </div>

  </div>

  <!-- markdown and diagram rendering for assistant responses -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js" defer></script>
  <!-- adjust path to wherever you serve the script -->
  <script src="/static/js/chatbot-widget.js" defer></script>

</body>
</html>
