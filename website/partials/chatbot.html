<!--
  Portfolio chatbot widget v2 — redesigned with avatar header.
  Drop this in once, near </body>, on every page.
  Pair with: <script src="/static/js/chatbot-widget.js" defer></script>

  AVATAR: Replace the `src` on .cb-avatar-img with your photo URL
          (e.g. /static/img/oswald.jpg). Square crop, 240×240+ recommended.
          If the image fails to load, a gradient "O" fallback is shown.
-->
<div id="chatbot-root">
  <button id="chatbot-launcher" type="button" aria-label="Open chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <div id="chatbot-panel" role="dialog" aria-label="Chat with Oswald's assistant">
    <header class="cb-header">
      <button id="chatbot-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="cb-avatar-wrap">
        <div class="cb-avatar-ring cb-avatar-ring-2"></div>
        <div class="cb-avatar-ring cb-avatar-ring-1"></div>
        <div class="cb-avatar">
          <!-- Swap src with your photo -->
          <img class="cb-avatar-img" src="/static/img/avatar.jpg" alt="Oswald"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cb-avatar-fallback',textContent:'O'}))" />
        </div>
      </div>

      <div class="cb-header-text">
        <strong>Oswald's Assistant</strong>
        <span>Ask me anything about his work</span>
      </div>
    </header>

    <div id="chatbot-messages" aria-live="polite"></div>

    <form id="chatbot-form" autocomplete="off">
      <input id="chatbot-input" type="text" placeholder="Ask me anything…" required />
      <button type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>
</div>

<style>
  :root {
    --cb-font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --cb-primary: #4f46e5;
    --cb-primary-2: #7c3aed;
    --cb-primary-light: #818cf8;
    --cb-surface: #ffffff;
    --cb-bg: #fafafa;
    --cb-text: #1e1b4b;
    --cb-text-muted: #6b7280;
    --cb-border: #e5e7eb;
    --cb-shadow: 0 20px 50px -10px rgba(79, 70, 229, 0.25),
                 0 8px 20px -8px rgba(0, 0, 0, 0.1);
  }

  #chatbot-root {
    position: fixed;
    right: 24px; bottom: 24px;
    z-index: 9999;
    font-family: var(--cb-font);
  }

  /* ----- Launcher ----- */
  #chatbot-launcher {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--cb-primary) 0%, var(--cb-primary-2) 100%);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #chatbot-launcher:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 12px 28px rgba(79, 70, 229, 0.5);
  }
  #chatbot-launcher svg { width: 26px; height: 26px; }

  /* ----- Panel ----- */
  #chatbot-panel {
    display: none;
    position: absolute;
    right: 0; bottom: 78px;
    width: 420px;
    max-width: calc(100vw - 32px);
    height: 640px;
    max-height: calc(100vh - 120px);
    background: var(--cb-surface);
    color: var(--cb-text);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--cb-shadow);
    flex-direction: column;
    animation: cb-rise 0.25s ease-out;
  }
  #chatbot-panel.cb-open { display: flex; }
  @keyframes cb-rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ----- Header / avatar ----- */
  .cb-header {
    position: relative;
    padding: 28px 20px 24px;
    background: linear-gradient(180deg, #ede9fe 0%, #f5f3ff 60%, #ffffff 100%);
    text-align: center;
    border-bottom: 1px solid var(--cb-border);
  }
  #chatbot-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--cb-text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  #chatbot-close:hover { background: rgba(255, 255, 255, 0.95); }
  #chatbot-close svg { width: 16px; height: 16px; }

  .cb-avatar-wrap {
    position: relative;
    width: 96px; height: 96px;
    margin: 0 auto 14px;
  }
  .cb-avatar-ring {
    position: absolute;
    border-radius: 50%;
    background: rgba(129, 140, 248, 0.25);
    animation: cb-pulse 3s ease-in-out infinite;
  }
  .cb-avatar-ring-1 { inset: -8px;  opacity: 0.5; }
  .cb-avatar-ring-2 { inset: -16px; opacity: 0.25; animation-delay: 0.5s; }
  @keyframes cb-pulse {
    0%, 100% { transform: scale(1);    opacity: 0.3; }
    50%      { transform: scale(1.05); opacity: 0.6; }
  }
  .cb-avatar {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #c7d2fe 0%, #ddd6fe 100%);
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.2);
  }
  .cb-avatar-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .cb-avatar-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--cb-primary) 0%, var(--cb-primary-2) 100%);
  }

  .cb-header-text strong {
    display: block;
    font-size: 17px; font-weight: 600;
    color: var(--cb-text);
    margin-bottom: 2px;
  }
  .cb-header-text span {
    font-size: 13px;
    color: var(--cb-text-muted);
  }

  /* ----- Messages ----- */
  #chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--cb-bg);
  }
  #chatbot-messages::-webkit-scrollbar { width: 6px; }
  #chatbot-messages::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.15);
    border-radius: 3px;
  }
  .cb-msg {
    padding: 12px 16px;
    border-radius: 16px;
    max-width: 82%;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 15px;
    animation: cb-in 0.2s ease-out;
  }
  @keyframes cb-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .cb-user {
    background: linear-gradient(135deg, var(--cb-primary) 0%, var(--cb-primary-light) 100%);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
  }
  .cb-assistant {
    background: var(--cb-surface);
    color: var(--cb-text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--cb-border);
  }

  /* Typing indicator */
  .cb-typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .cb-typing span {
    width: 7px; height: 7px;
    background: var(--cb-text-muted);
    border-radius: 50%;
    animation: cb-bounce 1.2s ease-in-out infinite;
  }
  .cb-typing span:nth-child(2) { animation-delay: 0.15s; }
  .cb-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes cb-bounce {
    0%, 60%, 100% { transform: translateY(0);    opacity: 0.5; }
    30%           { transform: translateY(-5px); opacity: 1; }
  }

  /* ----- Input ----- */
  #chatbot-form {
    display: flex; gap: 10px;
    padding: 14px 16px;
    background: var(--cb-surface);
    border-top: 1px solid var(--cb-border);
  }
  #chatbot-input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--cb-border);
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    outline: none;
    color: var(--cb-text);
    background: var(--cb-bg);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  #chatbot-input:focus {
    border-color: var(--cb-primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }
  #chatbot-form button {
    width: 44px; height: 44px; padding: 0;
    background: linear-gradient(135deg, var(--cb-primary) 0%, var(--cb-primary-2) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #chatbot-form button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  }
  #chatbot-form button svg { width: 18px; height: 18px; }

  /* ----- Mobile ----- */
  @media (max-width: 480px) {
    #chatbot-root { right: 16px; bottom: 16px; }
    #chatbot-panel {
      width: calc(100vw - 24px);
      height: calc(100vh - 100px);
      right: -8px;
    }
  }
</style>
